<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#06161c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Serpent" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
<title>Serpent — Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg0:#06161c; --bg1:#0a2230; --panel:#0e2a33; --line:rgba(120,210,195,.16);
    --ink:#eaf6f2; --muted:#7fa39c;
    --gold:#ffd24a; --coral:#ff7a4d; --red:#ef3e57;
    --mint:#34f0c6; --cyan:#19c6e6; --danger:#ff4d5e;
    --disp:'Bungee', 'Arial Black', system-ui, sans-serif;
    --body:'Space Grotesk', system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; height:100%; overscroll-behavior:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  body{
    font-family:var(--body); color:var(--ink); overflow:hidden;
    background:
      radial-gradient(120% 90% at 18% 8%, #103038 0%, rgba(16,48,56,0) 55%),
      radial-gradient(120% 90% at 85% 95%, #2a1430 0%, rgba(42,20,48,0) 50%),
      linear-gradient(160deg, var(--bg1), var(--bg0));
    display:flex; align-items:center; justify-content:center;
    position:fixed; inset:0; height:auto;
    padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  }
  body::before, body::after{content:""; position:fixed; border-radius:50%; filter:blur(70px); opacity:.32; pointer-events:none; z-index:0;}
  body::before{width:46vmax; height:46vmax; left:-12vmax; top:-14vmax; background:radial-gradient(circle, var(--cyan), transparent 65%); animation:drift1 26s ease-in-out infinite alternate;}
  body::after{width:40vmax; height:40vmax; right:-10vmax; bottom:-12vmax; background:radial-gradient(circle, var(--coral), transparent 65%); animation:drift2 32s ease-in-out infinite alternate;}
  @keyframes drift1{from{transform:translate(0,0) scale(1);}to{transform:translate(8vmax,6vmax) scale(1.15);}}
  @keyframes drift2{from{transform:translate(0,0) scale(1.1);}to{transform:translate(-7vmax,-5vmax) scale(.9);}}

  .arena{
    position:relative; z-index:1;
    width:min(94vw, 80vh, 600px); aspect-ratio:1/1;
    border-radius:26px; overflow:hidden;
    border:1px solid var(--line);
    background:#06161c;
    box-shadow:
      0 0 0 6px rgba(8,22,28,.6),
      0 0 0 7px rgba(120,210,195,.10),
      0 30px 80px rgba(0,0,0,.55),
      inset 0 0 60px rgba(0,0,0,.6);
  }
  canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair;}

  /* ---------- HUD ---------- */
  .hud{position:absolute; inset:0; padding:16px 18px; display:flex; flex-direction:column;
    justify-content:space-between; pointer-events:none; z-index:5;}
  .hud .row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .stat{display:flex; flex-direction:column; line-height:1;}
  .stat .lbl{font-size:10px; letter-spacing:3px; color:var(--muted); text-transform:uppercase; font-weight:700;}
  .stat .val{font-family:var(--disp); font-size:34px; color:var(--ink); margin-top:4px;
    text-shadow:0 0 18px rgba(52,240,198,.25);}
  .stat.right{align-items:flex-end;}
  .stat.right .val{font-size:20px; color:var(--mint);}
  .val.pop{animation:pop .26s ease-out;}
  @keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.35); color:var(--gold);}100%{transform:scale(1);}}
  .chip{font-family:var(--body); font-weight:700; font-size:12px; letter-spacing:1px; color:var(--ink);
    background:rgba(10,30,38,.6); border:1px solid var(--line); border-radius:999px; padding:7px 13px;
    backdrop-filter:blur(4px);}
  .chip b{color:var(--gold); font-family:var(--disp); font-size:14px;}
  .mute{pointer-events:auto; cursor:pointer; width:42px; height:42px; border-radius:50%;
    border:1px solid var(--line); background:rgba(10,30,38,.6); color:var(--ink); font-size:18px;
    backdrop-filter:blur(4px); box-shadow:0 4px 0 rgba(0,0,0,.3); transition:transform .1s;}
  .mute:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.3);}
  .tools{display:flex; gap:8px; pointer-events:auto;}
  .lang{pointer-events:auto; cursor:pointer; height:42px; padding:0 12px; border-radius:999px;
    border:1px solid var(--line); background:rgba(10,30,38,.6); color:var(--muted); font-family:var(--body);
    font-weight:700; font-size:12px; letter-spacing:1px; backdrop-filter:blur(4px); box-shadow:0 4px 0 rgba(0,0,0,.3);
    transition:transform .1s;}
  .lang:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.3);}
  .lang span.on{color:var(--gold);}
  .btn,.mute,.lang{touch-action:manipulation;}

  /* ---------- Overlays ---------- */
  .ov{position:absolute; inset:0; z-index:4; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; text-align:center; padding:26px;
    background:radial-gradient(120% 100% at 50% 30%, rgba(6,22,28,.55), rgba(4,12,16,.86));
    backdrop-filter:blur(5px); transition:opacity .35s, transform .35s;}
  .ov.hidden{display:none;}
  .kicker{font-size:11px; letter-spacing:5px; color:var(--mint); text-transform:uppercase; font-weight:700;}
  .title{font-family:var(--disp); font-size:clamp(40px,12vw,76px); line-height:.92; margin:0;
    color:var(--ink); letter-spacing:1px;
    text-shadow:0 4px 0 rgba(0,0,0,.4), 0 0 30px rgba(255,122,77,.35); animation:float 4s ease-in-out infinite;}
  .title .a{color:var(--gold);} .title .b{color:var(--coral);} .title .c{color:var(--red);}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  .wave{width:min(70%,260px); height:22px; margin-top:-6px;}
  .wave path{stroke-dasharray:9 13; animation:dash 1.1s linear infinite;}
  @keyframes dash{to{stroke-dashoffset:-44;}}
  .tag{max-width:340px; color:var(--muted); font-size:14px; line-height:1.5; font-weight:500;}
  .keys{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:340px;}
  .keys .k{font-size:12px; color:var(--ink); background:rgba(255,255,255,.06); border:1px solid var(--line);
    border-radius:8px; padding:5px 10px; font-weight:600;}
  .keys .k b{color:var(--gold);}
  .btn{pointer-events:auto; cursor:pointer; border:none; border-radius:14px; padding:14px 38px;
    font-family:var(--disp); font-size:20px; letter-spacing:1px; color:#1a0e08;
    background:linear-gradient(180deg, var(--gold), var(--coral));
    box-shadow:0 6px 0 #b8431f, 0 14px 30px rgba(255,122,77,.35); transition:transform .08s, box-shadow .08s;}
  .btn:active{transform:translateY(4px); box-shadow:0 2px 0 #b8431f, 0 6px 14px rgba(255,122,77,.3);}
  .btn.ghost{background:transparent; color:var(--ink); border:1px solid var(--line); box-shadow:none; font-family:var(--body); font-size:14px; padding:11px 24px;}
  .btn.ghost:active{transform:translateY(2px);}
  .btnrow{display:flex; gap:12px; flex-wrap:wrap; justify-content:center;}
  .scorecard{display:flex; gap:26px; align-items:flex-end;}
  .scorecard .stat .val{font-size:40px;}
  .scorecard .stat .val.m{color:var(--mint);}
  .big{font-family:var(--disp); font-size:clamp(34px,9vw,58px); color:var(--danger); margin:0;
    text-shadow:0 4px 0 rgba(0,0,0,.4), 0 0 30px rgba(255,77,94,.4);}
</style>
</head>
<body>
  <div class="arena" id="arena">
    <canvas id="game"></canvas>

    <div class="hud">
      <div class="row">
        <div class="stat"><span class="lbl" data-i="score"></span><span class="val" id="score">0</span></div>
        <div class="chip"><span data-i="record"></span> <b id="bestHud">0</b></div>
        <div class="tools">
          <button class="lang" id="lang" aria-label="Langue / Language"><span data-l="fr">FR</span> / <span data-l="en">US</span></button>
          <button class="mute" id="mute" title="Son / Sound">🔊</button>
        </div>
      </div>
      <div class="row">
        <div class="chip"><span data-i="len"></span> <b id="len">4</b></div>
        <div class="chip"><span data-i="spd"></span> <b id="spd">×1.0</b></div>
      </div>
    </div>

    <!-- Start -->
    <div class="ov" id="ovStart">
      <div class="kicker" data-i="kicker"></div>
      <h1 class="title" id="mainTitle"></h1>
      <svg class="wave" viewBox="0 0 300 24" preserveAspectRatio="none">
        <defs><linearGradient id="wg" x1="0" x2="1"><stop offset="0" stop-color="#ffd24a"/><stop offset=".5" stop-color="#ff7a4d"/><stop offset="1" stop-color="#ef3e57"/></linearGradient></defs>
        <path d="M2 12 Q 21 2 40 12 T 78 12 T 116 12 T 154 12 T 192 12 T 230 12 T 268 12 T 298 12" fill="none" stroke="url(#wg)" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <p class="tag" data-i="tag"></p>
      <div class="keys">
        <span class="k" data-i="k1" data-html></span>
        <span class="k" data-i="k2" data-html></span>
        <span class="k" data-i="k3"></span>
      </div>
      <button class="btn" id="playBtn" data-i="play"></button>
    </div>

    <!-- Pause -->
    <div class="ov hidden" id="ovPause">
      <div class="kicker" data-i="paused"></div>
      <h1 class="title" style="font-size:clamp(34px,9vw,56px)" data-i="pause"></h1>
      <button class="btn" id="resumeBtn" data-i="resume"></button>
    </div>

    <!-- Game over -->
    <div class="ov hidden" id="ovOver">
      <div class="kicker" data-i="over"></div>
      <h1 class="big" data-i="lost"></h1>
      <div class="scorecard">
        <div class="stat"><span class="lbl" data-i="score"></span><span class="val" id="finalScore">0</span></div>
        <div class="stat"><span class="lbl" data-i="recordL"></span><span class="val m" id="finalBest">0</span></div>
        <div class="stat"><span class="lbl" data-i="lenL"></span><span class="val" id="finalLen">0</span></div>
      </div>
      <div class="btnrow">
        <button class="btn" id="retryBtn" data-i="retry"></button>
        <button class="btn ghost" id="menuBtn" data-i="menu"></button>
      </div>
    </div>
  </div>

<script>
"use strict";
/* ===================== Config ===================== */
const COLS = 20, ROWS = 20, HALO = 0.45, TAIL = 0.34;

/* ===================== Color utils ===================== */
function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function ramp(stops,t){ t=Math.max(0,Math.min(1,t)); const n=stops.length-1,f=t*n,i=Math.min(n-1,Math.floor(f)),k=f-i,a=stops[i],b=stops[i+1];
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*k)},${Math.round(a[1]+(b[1]-a[1])*k)},${Math.round(a[2]+(b[2]-a[2])*k)})`; }
const WARM = { headHi:'#ffe79a', head:'#ffce45', glow:'rgba(255,120,70,.55)', glowSolid:'rgb(255,120,70)', pupil:'#241018', tongue:'#ff3b6b',
  body:[hexToRgb('#ffd24a'),hexToRgb('#ff7a4d'),hexToRgb('#ef3e57')] };
const COOL = { headHi:'#c4fff2', head:'#5fe6cf', glow:'rgba(60,200,230,.35)', glowSolid:'rgb(60,200,230)', pupil:'#06222a', tongue:'#34f0c6',
  body:[hexToRgb('#7af0dd'),hexToRgb('#34c6e6'),hexToRgb('#2f8bd6')] };
const WARMRGB = WARM.body.concat([hexToRgb('#ffe79a')]);
const MINTRGB = [hexToRgb('#34f0c6'),hexToRgb('#9bffe9'),[255,255,255]];

/* ===================== Canvas ===================== */
const arena = document.getElementById('arena');
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let dpr=1, W=0, H=0, cell=0;
function resize(){
  const r = arena.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio||1, 2);
  W = r.width; H = r.height;
  canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
  cell = W / COLS;
}
window.addEventListener('resize', resize);

/* ===================== Audio ===================== */
let AC=null, master=null, muted=false;
function initAudio(){ if(AC){ if(AC.state==='suspended')AC.resume(); return; }
  AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.gain.value=muted?0:0.9; master.connect(AC.destination); }
function beep(freq,dur,type,vol,when,slideTo){ if(!AC)return; const t=AC.currentTime+(when||0); const o=AC.createOscillator(); o.type=type||'triangle';
  o.frequency.setValueAtTime(freq,t); if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(1,slideTo),t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.3,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.03); }
function noiseBurst(dur,vol,lp0,lp1){ if(!AC)return; const t=AC.currentTime; const n=AC.createBufferSource();
  const buf=AC.createBuffer(1,Math.max(1,Math.floor(AC.sampleRate*dur)),AC.sampleRate); const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length); n.buffer=buf;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(lp0,t); f.frequency.exponentialRampToValueAtTime(Math.max(1,lp1),t+dur);
  const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  n.connect(f); f.connect(g); g.connect(master); n.start(t); n.stop(t+dur); }
function sEat(){ if(!AC||muted)return; beep(523,0.07,'triangle',0.22,0); beep(784,0.08,'triangle',0.22,0.05); beep(1318,0.06,'sine',0.13,0.09); }
function sDie(){ if(!AC||muted)return; noiseBurst(0.5,0.4,1800,120); beep(330,0.5,'sawtooth',0.28,0,70); beep(110,0.4,'sine',0.28,0.05); }
function sStart(){ if(!AC||muted)return; [392,523,659,784].forEach((f,i)=>beep(f,0.09,'triangle',0.2,i*0.06)); }

/* ===================== Particles & FX ===================== */
const parts=[]; const amb=[];
let flash={r:52,g:240,b:198,a:0}, shake=0, punch=1, time=0;
for(let i=0;i<26;i++) amb.push({x:Math.random(),y:Math.random(),r:1+Math.random()*2.4,sp:0.01+Math.random()*0.03,a:0.05+Math.random()*0.12});
function spawnEat(cx,cy){ for(let i=0;i<16;i++){ const a=Math.random()*6.283,sp=60+Math.random()*150; const c=MINTRGB[i%3];
  parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.5+Math.random()*0.4,max:0.9,size:2+Math.random()*3,c,g:140}); } }
function spawnDeath(segs){ for(let i=0;i<segs.length;i++){ const p=segs[i]; const n=2; for(let k=0;k<n;k++){ const a=Math.random()*6.283,sp=40+Math.random()*220; const c=WARMRGB[i%WARMRGB.length];
  parts.push({x:p.x*cell+cell/2,y:p.y*cell+cell/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:0.6+Math.random()*0.7,max:1.3,size:3+Math.random()*4,c,g:320}); } } }
function updateParts(dt){ for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life-=dt; if(p.life<=0){parts.splice(i,1);continue;} p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.g*dt; p.vx*=0.98; } }
function drawParts(){ for(const p of parts){ const a=Math.max(0,p.life/p.max); ctx.globalAlpha=a; ctx.fillStyle=`rgb(${p.c[0]},${p.c[1]},${p.c[2]})`;
  ctx.beginPath(); ctx.arc(p.x,p.y,p.size*(0.4+0.6*a),0,6.283); ctx.fill(); } ctx.globalAlpha=1; }
function updateAmb(dt){ for(const a of amb){ a.y-=a.sp*dt; if(a.y<-0.05){a.y=1.05;a.x=Math.random();} } }

/* ===================== Snake factory ===================== */
function stepDurFor(score){ return Math.max(0.062, 0.135 - score*0.0014); }
function makeSnake(isDemo){
  const s={ isDemo, snake:[], prev:[], dir:{x:1,y:0}, pending:null, t:0, dead:false, food:null, blink:2, tongue:0 };
  function placeFood(){ const occ=new Set(s.snake.map(p=>p.x+','+p.y)); let x,y,tries=0;
    do{ x=Math.floor(Math.random()*COLS); y=Math.floor(Math.random()*ROWS); tries++; }while(occ.has(x+','+y)&&tries<600);
    s.food={x,y,t:0}; }
  function reset(){ const cx=Math.floor(COLS/2),cy=Math.floor(ROWS/2); s.snake=[]; for(let i=0;i<4;i++)s.snake.push({x:cx-i,y:cy});
    s.prev=s.snake.map(p=>({x:p.x,y:p.y})); s.dir={x:1,y:0}; s.pending=null; s.t=0; s.dead=false; s.blink=2+Math.random()*3; s.tongue=0; placeFood(); }
  function setDir(d){ const cur=s.pending||s.dir; if(d.x===-cur.x&&d.y===-cur.y)return; if(d.x===cur.x&&d.y===cur.y)return; s.pending=d; }
  function think(){ const head=s.snake[0]; const occ=new Set(s.snake.map(p=>p.x+','+p.y));
    const dirs=[{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
    const safe=dirs.filter(d=>{ if(d.x===-s.dir.x&&d.y===-s.dir.y)return false; const nx=head.x+d.x,ny=head.y+d.y;
      return nx>=0&&ny>=0&&nx<COLS&&ny<ROWS&&!occ.has(nx+','+ny); });
    if(!safe.length)return; let best=null,bs=-1;
    for(const d of safe){ const nx=head.x+d.x,ny=head.y+d.y; const dist=Math.abs(nx-s.food.x)+Math.abs(ny-s.food.y);
      let free=0; for(const dd of dirs){ const ax=nx+dd.x,ay=ny+dd.y; if(ax>=0&&ay>=0&&ax<COLS&&ay<ROWS&&!occ.has(ax+','+ay))free++; }
      const sc=-dist*2+free*3+Math.random()*2; if(sc>bs){bs=sc;best=d;} }
    if(best)setDir(best); }
  function die(){ s.dead=true; if(!s.isDemo) onDie(); }
  function step(){ if(s.dead)return; if(s.isDemo)think();
    if(s.pending){ const cur=s.dir; if(!(s.pending.x===-cur.x&&s.pending.y===-cur.y))s.dir=s.pending; s.pending=null; }
    const head=s.snake[0]; const nh={x:head.x+s.dir.x,y:head.y+s.dir.y};
    if(nh.x<0||nh.y<0||nh.x>=COLS||nh.y>=ROWS){die();return;}
    const ate=!!(s.food&&nh.x===s.food.x&&nh.y===s.food.y);
    const limit=s.snake.length-(ate?0:1);
    for(let i=0;i<limit;i++){ if(s.snake[i].x===nh.x&&s.snake[i].y===nh.y){die();return;} }
    s.prev=s.snake.map(p=>({x:p.x,y:p.y})); if(ate)s.prev.push({x:s.prev[s.prev.length-1].x,y:s.prev[s.prev.length-1].y});
    s.snake=[nh,...s.snake]; if(!ate)s.snake.pop(); s.t=0;
    if(ate){ if(!s.isDemo)onEat(s.food); placeFood(); } }
  function update(dt){ if(s.food)s.food.t+=dt; s.blink-=dt; if(s.blink<0)s.blink=2+Math.random()*4; s.tongue+=dt;
    if(s.dead)return; const sd=isDemo?0.15:stepDurFor(score); s.t+=dt/sd; let g=0; while(s.t>=1&&!s.dead&&g<4){s.t-=1;step();g++;} }
  function rendered(){ const out=[],n=s.snake.length; for(let i=0;i<n;i++){ const a=s.prev[i]||s.snake[i],b=s.snake[i],t=s.dead?1:s.t; out.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t}); } return out; }
  function drawHead(p,dir,pal,alpha){ const x=p.x*cell+cell/2,y=p.y*cell+cell/2;
    const ang=Math.atan2(dir.y,dir.x), ca=Math.cos(ang), sa=Math.sin(ang);
    const L=(lx,ly)=>[x+(lx*ca-ly*sa)*cell, y+(lx*sa+ly*ca)*cell];
    const ga=ctx.globalAlpha; ctx.globalAlpha=alpha*HALO; ctx.fillStyle=pal.glowSolid; ctx.beginPath(); ctx.arc(x,y,cell*0.66,0,6.283); ctx.fill(); ctx.globalAlpha=ga;
    const s0=L(0.5,0), s1=L(-0.5,0); const g=ctx.createLinearGradient(s0[0],s0[1],s1[0],s1[1]); g.addColorStop(0,pal.headHi); g.addColorStop(1,pal.head); ctx.fillStyle=g;
    [[-0.05,0.30,0.27],[-0.05,-0.30,0.27],[-0.34,0,0.24]].forEach(b=>{ const q=L(b[0],b[1]); ctx.beginPath(); ctx.arc(q[0],q[1],b[2]*cell,0,6.283); ctx.fill(); });
    let q=L(0,0); ctx.beginPath(); ctx.ellipse(q[0],q[1],0.44*cell,0.40*cell,ang,0,6.283); ctx.fill();
    q=L(0.34,0); ctx.beginPath(); ctx.ellipse(q[0],q[1],0.30*cell,0.26*cell,ang,0,6.283); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.26)'; q=L(0.06,0.13); ctx.beginPath(); ctx.ellipse(q[0],q[1],0.20*cell,0.11*cell,ang,0,6.283); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,.40)'; q=L(0.46,0.11); ctx.beginPath(); ctx.ellipse(q[0],q[1],0.05*cell,0.035*cell,ang,0,6.283); ctx.fill(); q=L(0.46,-0.11); ctx.beginPath(); ctx.ellipse(q[0],q[1],0.05*cell,0.035*cell,ang,0,6.283); ctx.fill();
    if(Math.sin(s.tongue*8)>0.6){ const tb=L(0.55,0), tm=L(0.74,0), t1=L(0.82,0.10), t2=L(0.82,-0.10);
      ctx.strokeStyle=pal.tongue; ctx.lineWidth=Math.max(1,cell*0.06); ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(tb[0],tb[1]); ctx.lineTo(tm[0],tm[1]); ctx.lineTo(t1[0],t1[1]); ctx.moveTo(tm[0],tm[1]); ctx.lineTo(t2[0],t2[1]); ctx.stroke(); }
    const blink=s.blink<0.12;
    for(const sgn of [1,-1]){ const e=L(0.12,0.24*sgn), pup=L(0.18,0.24*sgn);
      ctx.fillStyle='#fff'; ctx.beginPath(); if(blink)ctx.ellipse(e[0],e[1],cell*0.13,cell*0.035,ang,0,6.283); else ctx.arc(e[0],e[1],cell*0.135,0,6.283); ctx.fill();
      if(!blink){ ctx.fillStyle=pal.pupil; ctx.beginPath(); ctx.arc(pup[0],pup[1],cell*0.065,0,6.283); ctx.fill();
        ctx.fillStyle='rgba(255,255,255,.9)'; const hl2=L(0.16,0.22*sgn); ctx.beginPath(); ctx.arc(hl2[0],hl2[1],cell*0.022,0,6.283); ctx.fill(); } } }
  function draw(pal,alpha){ const r=rendered(); const n=r.length; if(!n)return; ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
    const cx=i=>r[i].x*cell+cell/2, cy=i=>r[i].y*cell+cell/2;
    const w=i=>{ const t=n>1?i/(n-1):0; return TAIL+(1-TAIL)*Math.pow(1-t,0.7); };
    ctx.globalAlpha=alpha*HALO; ctx.strokeStyle=pal.glowSolid; ctx.fillStyle=pal.glowSolid;
    for(let i=0;i<n;i++){ if(i<n-1){ ctx.lineWidth=cell*1.06*w(i); ctx.beginPath(); ctx.moveTo(cx(i),cy(i)); ctx.lineTo(cx(i+1),cy(i+1)); ctx.stroke(); } ctx.beginPath(); ctx.arc(cx(i),cy(i),cell*0.58*w(i),0,6.283); ctx.fill(); }
    ctx.globalAlpha=alpha;
    for(let i=0;i<n;i++){ const col=ramp(pal.body, n>1?i/(n-1):0); if(i<n-1){ ctx.strokeStyle=col; ctx.lineWidth=cell*0.72*w(i); ctx.beginPath(); ctx.moveTo(cx(i),cy(i)); ctx.lineTo(cx(i+1),cy(i+1)); ctx.stroke(); } ctx.fillStyle=col; ctx.beginPath(); ctx.arc(cx(i),cy(i),cell*0.39*w(i),0,6.283); ctx.fill(); }
    for(let i=0;i<n;i++){ const ww=w(i); const txp=(i<n-1?r[i+1].x-r[i].x:r[i].x-r[i-1].x), typ=(i<n-1?r[i+1].y-r[i].y:r[i].y-r[i-1].y); const tl=Math.hypot(txp,typ)||1; const Nx=-(typ/tl), Ny=(txp/tl); const half=cell*0.30*ww, mx=cx(i), my=cy(i);
      ctx.strokeStyle='rgba(0,0,0,.16)'; ctx.lineWidth=cell*0.10*ww; ctx.beginPath(); ctx.moveTo(mx-Nx*half,my-Ny*half); ctx.lineTo(mx+Nx*half,my+Ny*half); ctx.stroke();
      ctx.strokeStyle='rgba(255,255,255,.16)'; ctx.lineWidth=cell*0.045*ww; const fx=mx+(txp/tl)*cell*0.07, fy=my+(typ/tl)*cell*0.07; ctx.beginPath(); ctx.moveTo(fx-Nx*half*0.8,fy-Ny*half*0.8); ctx.lineTo(fx+Nx*half*0.8,fy+Ny*half*0.8); ctx.stroke(); }
    ctx.fillStyle='rgba(255,255,255,.30)'; for(let i=0;i<n;i++){ ctx.beginPath(); ctx.arc(cx(i)-cell*0.10*w(i),cy(i)-cell*0.11*w(i),cell*0.11*w(i),0,6.283); ctx.fill(); }
    drawHead(r[0],s.dir,pal,alpha); ctx.restore(); }
  return { s, reset, setDir, update, draw, rendered };
}

/* ===================== Food & field ===================== */
function drawFood(food,accent){ if(!food)return; const x=food.x*cell+cell/2,y=food.y*cell+cell/2; const p=0.5+0.5*Math.sin(food.t*6);
  const rt=(food.t%0.9)/0.9; ctx.strokeStyle=accent; ctx.globalAlpha=(1-rt)*0.5; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(x,y,cell*0.3+rt*cell*0.7,0,6.283); ctx.stroke(); ctx.globalAlpha=1;
  ctx.shadowColor=accent; ctx.shadowBlur=cell*0.8; const g=ctx.createRadialGradient(x,y,1,x,y,cell*0.45);
  g.addColorStop(0,'#fff'); g.addColorStop(0.4,accent); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(x,y,cell*0.42*(0.92+0.08*p),0,6.283); ctx.fill(); ctx.shadowBlur=0;
  ctx.fillStyle='#39d98a'; ctx.beginPath(); ctx.ellipse(x+cell*0.12,y-cell*0.34,cell*0.12,cell*0.06,-0.6,0,6.283); ctx.fill();
  for(let k=0;k<3;k++){ const a=food.t*3+k*2.094; ctx.fillStyle='rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(x+Math.cos(a)*cell*0.5,y+Math.sin(a)*cell*0.5,cell*0.04,0,6.283); ctx.fill(); } }
function drawField(){ const g=ctx.createRadialGradient(W*0.5,H*0.4,cell,W*0.5,H*0.5,W*0.85); g.addColorStop(0,'#0d2b34'); g.addColorStop(1,'#06161c');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H); ctx.fillStyle='rgba(120,200,190,.06)';
  for(let x=0;x<COLS;x++)for(let y=0;y<ROWS;y++){ ctx.beginPath(); ctx.arc(x*cell+cell/2,y*cell+cell/2,1.3,0,6.283); ctx.fill(); }
  for(const a of amb){ ctx.globalAlpha=a.a; ctx.fillStyle='#7ff0dd'; ctx.beginPath(); ctx.arc(a.x*W,a.y*H,a.r,0,6.283); ctx.fill(); } ctx.globalAlpha=1;
  const v=ctx.createRadialGradient(W/2,H/2,W*0.32,W/2,H/2,W*0.72); v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.5)'); ctx.fillStyle=v; ctx.fillRect(0,0,W,H); }

/* ===================== i18n (FR / US) ===================== */
const I18N={
  fr:{ kicker:'Arcade · solo', title:'SERPENT', tag:'Avale les orbes lumineuses, grandis sans te mordre la queue, et survis le plus longtemps possible.',
    k1:'<b>↑ ↓ ← →</b> / <b>ZQSD</b> diriger', k2:'<b>P</b> pause', k3:'glisser ou cliquer pour diriger',
    play:'JOUER', score:'Score', record:'RECORD', len:'LONGUEUR', spd:'VITESSE', paused:'En pause', pause:'PAUSE', resume:'REPRENDRE',
    over:'Partie terminée', lost:'PERDU !', recordL:'Record', lenL:'Longueur', retry:'REJOUER', menu:'MENU' },
  en:{ kicker:'Arcade · solo', title:'SNAKE', tag:'Swallow the glowing orbs, grow without biting your tail, and survive as long as you can.',
    k1:'<b>↑ ↓ ← →</b> / <b>WASD</b> steer', k2:'<b>P</b> pause', k3:'swipe or click to steer',
    play:'PLAY', score:'Score', record:'BEST', len:'LENGTH', spd:'SPEED', paused:'Paused', pause:'PAUSE', resume:'RESUME',
    over:'Game over', lost:'GAME OVER!', recordL:'Best', lenL:'Length', retry:'RETRY', menu:'MENU' }
};
let lang='fr';
try{ const sv=localStorage.getItem('serpentLang'); lang = sv==='en'||sv==='fr' ? sv : ((navigator.language||'fr').toLowerCase().startsWith('fr')?'fr':'en'); }catch(e){}
function applyLang(){
  const T=I18N[lang];
  document.documentElement.lang=lang;
  document.title = lang==='fr' ? 'Serpent — Arcade' : 'Snake — Arcade';
  document.querySelectorAll('[data-i]').forEach(el=>{ const v=T[el.dataset.i]; if(v==null)return; if(el.hasAttribute('data-html'))el.innerHTML=v; else el.textContent=v; });
  const t=T.title; document.getElementById('mainTitle').innerHTML =
    `<span class="a">${t[0]}</span><span class="b">${t[1]}</span><span class="c">${t[2]}</span>${t.slice(3)}`;
  document.querySelectorAll('[data-l]').forEach(el=>el.classList.toggle('on', el.dataset.l===lang));
}
document.getElementById('lang').onclick=()=>{ lang=lang==='fr'?'en':'fr'; try{localStorage.setItem('serpentLang',lang);}catch(e){} applyLang(); };

/* ===================== Game state ===================== */
let mode='menu', score=0, best=0; try{ best=parseInt(localStorage.getItem('serpentBest')||'0',10)||0; }catch(e){}
const game=makeSnake(false), demo=makeSnake(true); demo.reset();

const elScore=document.getElementById('score'), elBestHud=document.getElementById('bestHud'), elLen=document.getElementById('len'), elSpd=document.getElementById('spd');
const ovStart=document.getElementById('ovStart'), ovPause=document.getElementById('ovPause'), ovOver=document.getElementById('ovOver');
function updateHud(pop){ elScore.textContent=score; elLen.textContent=game.s.snake.length; elSpd.textContent='×'+(0.135/stepDurFor(score)).toFixed(1);
  elBestHud.textContent=best; if(pop){ elScore.classList.remove('pop'); void elScore.offsetWidth; elScore.classList.add('pop'); } }
function onEat(food){ score+=10; updateHud(true); flash={r:52,g:240,b:198,a:0.5}; punch=1.06; spawnEat(food.x*cell+cell/2,food.y*cell+cell/2); sEat(); }
function onDie(){ mode='dead'; sDie(); flash={r:255,g:77,b:94,a:0.6}; shake=22; spawnDeath(game.rendered());
  if(score>best){ best=score; try{ localStorage.setItem('serpentBest',String(best)); }catch(e){} } updateHud(false);
  document.getElementById('finalScore').textContent=score; document.getElementById('finalBest').textContent=best; document.getElementById('finalLen').textContent=game.s.snake.length;
  setTimeout(()=>{ if(mode==='dead') ovOver.classList.remove('hidden'); }, 850); }
function start(){ initAudio(); game.reset(); score=0; updateHud(false); mode='playing'; ovStart.classList.add('hidden'); ovOver.classList.add('hidden'); ovPause.classList.add('hidden'); sStart(); }
function toMenu(){ mode='menu'; demo.reset(); ovOver.classList.add('hidden'); ovPause.classList.add('hidden'); ovStart.classList.remove('hidden'); updateHud(false); }
function togglePause(){ if(mode==='playing'){ mode='paused'; ovPause.classList.remove('hidden'); } else if(mode==='paused'){ mode='playing'; ovPause.classList.add('hidden'); } }

document.getElementById('playBtn').onclick=start;
document.getElementById('retryBtn').onclick=start;
document.getElementById('menuBtn').onclick=toMenu;
document.getElementById('resumeBtn').onclick=togglePause;
const muteBtn=document.getElementById('mute');
muteBtn.onclick=()=>{ initAudio(); muted=!muted; muteBtn.textContent=muted?'🔇':'🔊'; if(master)master.gain.value=muted?0:0.9; };

/* ===================== Input ===================== */
const DIRMAP={ArrowUp:[0,-1],KeyW:[0,-1],KeyZ:[0,-1],ArrowDown:[0,1],KeyS:[0,1],ArrowLeft:[-1,0],KeyA:[-1,0],KeyQ:[-1,0],ArrowRight:[1,0],KeyD:[1,0]};
window.addEventListener('keydown',e=>{ const k=e.code;
  if(DIRMAP[k]||k==='Space')e.preventDefault(); initAudio();
  if(k==='KeyP'||k==='Escape'){ if(mode==='playing'||mode==='paused')togglePause(); return; }
  if(mode==='menu'||mode==='dead'){ if(k==='Enter'||k==='Space')start(); return; }
  if(mode!=='playing')return; if(DIRMAP[k])game.setDir({x:DIRMAP[k][0],y:DIRMAP[k][1]}); });
window.addEventListener('blur',()=>{ if(mode==='playing'){ mode='paused'; ovPause.classList.remove('hidden'); } });
/* Swipe (doigt ou souris) + clic de souris : la tête va vers le point cliqué */
let pdown=false, psx=0, psy=0, pmoved=false;
const SWIPE=22;
canvas.addEventListener('pointerdown',e=>{ initAudio(); pdown=true; pmoved=false; psx=e.clientX; psy=e.clientY;
  try{canvas.setPointerCapture(e.pointerId);}catch(_){} });
canvas.addEventListener('pointermove',e=>{ if(!pdown||mode!=='playing')return; const dx=e.clientX-psx, dy=e.clientY-psy;
  if(Math.hypot(dx,dy)<SWIPE)return; pmoved=true; psx=e.clientX; psy=e.clientY;
  if(Math.abs(dx)>Math.abs(dy))game.setDir({x:dx>0?1:-1,y:0}); else game.setDir({x:0,y:dy>0?1:-1}); });
function endPointer(e){ if(!pdown)return; pdown=false;
  if(pmoved||mode!=='playing'||e.pointerType!=='mouse'||e.type==='pointercancel')return;
  const r=canvas.getBoundingClientRect(), h=game.rendered()[0]; if(!h)return;
  const dx=(e.clientX-r.left)-(h.x*cell+cell/2), dy=(e.clientY-r.top)-(h.y*cell+cell/2);
  if(Math.hypot(dx,dy)<cell*0.4)return;
  if(Math.abs(dx)>Math.abs(dy))game.setDir({x:dx>0?1:-1,y:0}); else game.setDir({x:0,y:dy>0?1:-1}); }
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{ if(e.target===canvas)e.preventDefault(); },{passive:false});
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&mode==='playing'){ mode='paused'; ovPause.classList.remove('hidden'); } });

/* ===================== Loop ===================== */
let last=performance.now();
function frame(now){ requestAnimationFrame(frame); const dt=Math.min(0.05,(now-last)/1000); last=now; time+=dt;
  updateAmb(dt); updateParts(dt); flash.a=Math.max(0,flash.a-dt*3); shake*=Math.pow(0.0008,dt); if(shake<0.3)shake=0; punch=Math.max(1,punch-dt*5);
  if(mode==='menu'){ demo.update(dt); if(demo.s.dead)demo.reset(); }
  else if(mode==='playing'){ game.update(dt); }

  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H); ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  if(punch>1){ ctx.translate(W/2,H/2); ctx.scale(punch,punch); ctx.translate(-W/2,-H/2); }
  drawField();
  if(mode==='menu'){ drawFood(demo.s.food,'rgba(120,240,210,.85)'); demo.draw(COOL,0.5); }
  else { drawFood(game.s.food,'#34f0c6'); if(mode!=='dead')game.draw(WARM,1); }
  drawParts();
  ctx.restore();
  if(flash.a>0){ ctx.fillStyle=`rgba(${flash.r},${flash.g},${flash.b},${flash.a*0.5})`; ctx.fillRect(0,0,W,H); }
}

applyLang(); resize(); updateHud(false); requestAnimationFrame(frame);
if('serviceWorker' in navigator && location.protocol.startsWith('http')){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
